<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안개골: 바람나침반 · 컨셉 프리뷰</title>
<link rel="stylesheet" href="src/styles.css?v=2">
<link rel="stylesheet" href="src/concept.css?v=2">
</head>
<body>
<div id="frame">
  <div id="stage" tabindex="-1">

    <!-- ===== START GATE (browsers only allow audio after a click) ===== -->
    <section id="gate" class="screen">
      <div class="bg" style="background-image:url(assets/backgrounds/bg_village_day.png)"></div>
      <div class="gate-wash"></div>
      <button class="gate-btn" id="gateBtn">
        <span class="gate-title">안개골 : 바람나침반</span>
        <span class="gate-sub">화면을 눌러 시작하세요</span>
        <span class="gate-note">♪ 음악이 함께 재생됩니다</span>
      </button>
    </section>

    <!-- ===== TITLE ===== -->
    <section id="title" class="screen hidden">
      <div class="bg kenburns" style="background-image:url(assets/backgrounds/bg_village_day.png)"></div>
      <div class="title-wash"></div>
      <svg class="compass-mark" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
        <circle cx="60" cy="60" r="46" fill="none" stroke="currentColor" stroke-width=".8" opacity=".35"/>
        <g class="needle">
          <path d="M60 18 L66 60 L60 66 L54 60 Z" fill="currentColor"/>
          <path d="M60 102 L66 60 L60 54 L54 60 Z" fill="currentColor" opacity=".35"/>
        </g>
        <circle cx="60" cy="60" r="3" fill="currentColor"/>
      </svg>
      <div class="title-block">
        <p class="eyebrow">Concept Preview</p>
        <h1 class="logo">
          <span class="logo-main">안개골</span>
          <span class="logo-sub"><i></i>바람나침반<i></i></span>
        </h1>
        <nav class="title-menu" aria-label="타이틀 메뉴">
          <button data-act="places">장소 둘러보기</button>
          <button data-act="cast">인물 소개</button>
          <button data-act="settings">설정</button>
        </nav>
      </div>
      <footer class="title-foot">
        <span>배경 9 · 인물 5 · 스토리 미포함 프리뷰</span>
        <span class="keys"><kbd>↑</kbd><kbd>↓</kbd> 이동 &nbsp; <kbd>Enter</kbd> 선택</span>
      </footer>
    </section>

    <!-- ===== PLACES ===== -->
    <section id="places" class="screen hidden">
      <div class="bg-layer"><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div></div>
      <div class="chars" id="chars"></div>
      <div class="ui" id="placeUi">
        <nav class="chrome" aria-label="메뉴">
          <button data-act="hide" title="UI 숨기기 (H)">숨기기</button>
          <button data-act="home" title="타이틀 (Esc)">타이틀</button>
        </nav>
        <button class="arrow arrow-l" data-act="prev" aria-label="이전 장소">‹</button>
        <button class="arrow arrow-r" data-act="next" aria-label="다음 장소">›</button>
        <div class="plate" id="plate">
          <span class="plate-no" id="plateNo"></span>
          <div class="plate-main">
            <span class="plate-time" id="plateTime"></span>
            <span class="plate-name" id="plateName"></span>
          </div>
          <div class="plate-cast" id="plateCast"></div>
        </div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="hint hidden" id="hideHint">H 또는 클릭으로 UI 다시 보기</div>
    </section>

    <!-- ===== CAST ===== -->
    <section id="cast" class="screen hidden">
      <div class="bg cast-bg" id="castBg"></div>
      <div class="cast-veil"></div>
      <div class="cast-figure" id="castFigure"></div>
      <div class="cast-card">
        <span class="cast-en" id="castEn"></span>
        <h2 class="cast-name" id="castName"></h2>
        <span class="cast-role" id="castRole"></span>
        <div class="cast-poses" id="castPoses"></div>
      </div>
      <nav class="cast-tabs" id="castTabs"></nav>
      <nav class="chrome" aria-label="메뉴"><button data-act="home" title="타이틀 (Esc)">타이틀</button></nav>
    </section>

    <!-- ===== SETTINGS ===== -->
    <section class="overlay hidden" id="setOverlay" aria-label="설정">
      <div class="sheet narrow">
        <header><h2>설정</h2><button class="x" data-close>닫기</button></header>
        <div class="rows">
          <label class="row"><span>배경음</span><input type="range" id="optBgm" min="0" max="100" step="5"><output id="optBgmOut"></output></label>
          <div class="row"><span>화면</span><button class="pill" id="optFull">전체 화면 전환</button></div>
        </div>
      </div>
    </section>

    <button class="sound" id="soundBtn" aria-label="음악 켜기/끄기" title="음악 (M)"></button>
    <div class="fader" id="fader"></div>
  </div>
</div>
<audio id="bgm" src="assets/audio/bgm_title.mp3" loop preload="auto"></audio>
<script type="module" src="src/concept.js?v=2"></script>
</body>
</html>
